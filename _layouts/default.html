<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title | escape }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="#173b57">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title | escape }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <link rel="canonical" href="{{ '/' | absolute_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/homepage.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#about">Skip to main content</a>
  <header class="masthead">
    <nav class="navigation" aria-label="Main navigation">
      <a class="site-name" href="#about">Yu Zhou<span aria-hidden="true">.</span></a>
      <div class="nav-links">{% for item in site.data.navigation.main %}<a href="{{ item.url }}">{{ item.title }}</a>{% endfor %}</div>
    </nav>
  </header>
  <div class="site-layout">
    <aside class="profile" aria-label="Yu Zhou's profile">{% include author-profile.html %}</aside>
    <main id="main-content">{{ content }}</main>
  </div>
  <footer class="footer"><div><span>© {{ site.time | date: '%Y' }} Yu Zhou</span><span>Adapted from <a href="https://github.com/RayeRen/acad-homepage.github.io">AcadHomepage</a> · Inspired by <a href="https://github.com/yaoyao-liu/minimal-light">Minimal Light</a></span></div></footer>
  <script src="{{ '/assets/js/homepage.js' | relative_url }}" defer></script>
</body>
</html>
